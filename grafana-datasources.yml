###############################################################################
# Grafana Data Sources Configuration for InvoiceShelf Microservices Stack
# =============================================================================
# Only references services that exist in docker-compose.full.yml.
###############################################################################

apiVersion: 1

datasources:
  ##############################################################################
  # Prometheus — Primary metrics source (default)
  ##############################################################################
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
    readOnly: false
    editable: true
    orgId: 1

  ##############################################################################
  # Jaeger — Distributed tracing
  ##############################################################################
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    basicAuth: false
    isDefault: false
    jsonData:
      tracesToMetrics:
        datasourceUid: Prometheus
        tags:
          - key: service.name
            value: service
    readOnly: false
    editable: true
    orgId: 1

  ##############################################################################
  # PostgreSQL — Direct query (app database)
  ##############################################################################
  - name: PostgreSQL-App
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    database: invoiceshelf
    basicAuth: false
    jsonData:
      sslmode: disable
      maxOpenConns: 0
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      tlsAuth: false
      tlsAuthWithCACert: false
      tlsSkipVerify: false
    secureJsonData:
      password: postgres
    readOnly: false
    editable: true
    orgId: 1
