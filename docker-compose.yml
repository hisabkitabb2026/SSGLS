version: '3.8'

services:
  # InvoiceShelf Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: invoiceshelf-app:latest
    container_name: invoiceshelf-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - invoiceshelf-network
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=invoiceshelf
      - DB_USERNAME=root
      - DB_PASSWORD=secret123
    ports:
      - "8080:9000"

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: invoiceshelf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - invoiceshelf-network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: invoiceshelf-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invoiceshelf
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - invoiceshelf-network
    ports:
      - "3306:3306"

  # phpMyAdmin (Database Management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: invoiceshelf-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret123
    networks:
      - invoiceshelf-network
    ports:
      - "8081:80"

networks:
  invoiceshelf-network:
    driver: bridge

volumes:
  mysql-data:
