version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: transport-postgres
    environment:
      POSTGRES_USER: transport_user
      POSTGRES_PASSWORD: transport_password
      POSTGRES_DB: transport_db
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport_user -d transport_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transport-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: transport-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transport-network

  # Transport Microservice
  transport-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transport-service
    environment:
      APP_NAME: "Transport Microservice"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8006"
      DATABASE_URL: "postgresql://transport_user:transport_password@postgres:5432/transport_db"
      DATABASE_ECHO: "false"
      JWT_SECRET_KEY: "your-secret-key-change-this-in-production"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRATION_HOURS: "24"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "guest"
      RABBITMQ_PASSWORD: "guest"
      RABBITMQ_VHOST: "/"
      RABBITMQ_EXCHANGE: "transport_exchange"
      RABBITMQ_QUEUE: "transport_events"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      METRICS_ENABLED: "true"
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - transport-network
    command: >
      sh -c "python -m pip install -q -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8006 --reload"

  # pgAdmin (optional database management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: transport-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - transport-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  transport-network:
    driver: bridge
