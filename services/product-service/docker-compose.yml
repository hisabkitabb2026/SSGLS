version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: product-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-product_service}
      POSTGRES_USER: ${DB_USER:-product_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-product_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invoiceshelf-network
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-product_service}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8003}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-product_service}
      DB_PASSWORD: ${DB_PASSWORD:-product_password}
      DB_NAME: ${DB_NAME:-product_service}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-invoiceshelf}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/invoiceshelf}
      METRICS_PORT: ${METRICS_PORT:-9090}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invoiceshelf-network
    ports:
      - "${PORT:-8003}:8003"
      - "${METRICS_PORT:-9090}:9090"
    volumes:
      - ./.env:/root/.env:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: product-service-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - invoiceshelf-network
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - optional

networks:
  invoiceshelf-network:
    external: true

volumes:
  postgres_data:
  pgadmin_data:
