global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'settings-service-monitor'

scrape_configs:
  - job_name: 'settings-service'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:5432']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
