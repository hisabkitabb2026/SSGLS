global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: 'invoicing-microservice'

scrape_configs:
  - job_name: 'invoicing-service'
    static_configs:
      - targets: ['invoicing-service:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
