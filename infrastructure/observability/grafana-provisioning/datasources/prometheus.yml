apiVersion: 1

datasources:
  ##############################################################################
  # Prometheus Data Source
  ##############################################################################
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
    secureJsonData:
      basicAuthPassword: ""
    basicAuth: false

  ##############################################################################
  # Elasticsearch Data Source
  ##############################################################################
  - name: Elasticsearch
    type: elasticsearch
    url: http://elasticsearch:9200
    access: proxy
    isDefault: false
    database: "logs-*"
    jsonData:
      esVersion: "8.0.0"
      logMessageField: message
      logLevelField: level
      timeField: "@timestamp"
    secureJsonData:
      basicAuthPassword: changeme
    basicAuth: true
    basicAuthUser: elastic

  ##############################################################################
  # Jaeger Data Source
  ##############################################################################
  - name: Jaeger
    type: jaeger
    url: http://jaeger:16686
    access: proxy
    isDefault: false
    jsonData:
      nodeGraph:
        enabled: true
      lokiSearch:
        enabled: false
      spanBar:
        type: duration
    editable: true

  ##############################################################################
  # AlertManager Data Source
  ##############################################################################
  - name: AlertManager
    type: alertmanager
    url: http://alertmanager:9093
    access: proxy
    isDefault: false
    jsonData:
      implementation: prometheus
    editable: true
