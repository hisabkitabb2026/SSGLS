# RabbitMQ Configuration File
# Production-ready configuration for InvoiceShelf message queue

##############################################################################
# Network and Protocol Settings
##############################################################################

# Default user/password/vhost (configured via environment variables)
# RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS, RABBITMQ_DEFAULT_VHOST

# Network listener configuration
listeners.tcp.default = 5672
listeners.ssl.default = 5671

# Management plugin HTTP/HTTPS ports
management.tcp.port = 15672
management.ssl.port = 15671

# MQTT plugin configuration
mqtt.listeners.tcp.default = 1883
mqtt.listeners.ssl.default = 8883

# STOMP plugin configuration
stomp.listeners.tcp.default = 61613
stomp.listeners.ssl.default = 61614

##############################################################################
# SSL/TLS Configuration
##############################################################################

listeners.ssl.cacertfile = /etc/rabbitmq/certs/ca.crt
listeners.ssl.certfile = /etc/rabbitmq/certs/server.crt
listeners.ssl.keyfile = /etc/rabbitmq/certs/server.key
listeners.ssl.verify = verify_peer
listeners.ssl.fail_if_no_peer_cert = false

# Management SSL
management.ssl.cacertfile = /etc/rabbitmq/certs/ca.crt
management.ssl.certfile = /etc/rabbitmq/certs/server.crt
management.ssl.keyfile = /etc/rabbitmq/certs/server.key
management.ssl.verify = verify_peer
management.ssl.fail_if_no_peer_cert = false

##############################################################################
# Virtual Host Configuration
##############################################################################

# Default vhost created at startup (configured via environment)
# RABBITMQ_DEFAULT_VHOST

##############################################################################
# Management Plugin Configuration
##############################################################################

# HTTP listener configuration
management.tcp.ip = 0.0.0.0
management.tcp.backlog = 4096

# HTTPS listener configuration
management.ssl.ip = 0.0.0.0
management.ssl.backlog = 4096

# Cross-Origin Resource Sharing (CORS)
management.cors.origins.1 = http://localhost:3000
management.cors.origins.2 = http://localhost:8080
management.cors.origins.3 = http://invoiceshelf.test
management.cors.origins.4 = https://invoiceshelf.test

# Load definition on startup
management.load_definitions = /etc/rabbitmq/definitions.json

##############################################################################
# Queue Master Location
##############################################################################

# Automatically determine optimal master location
queue_master_locator = min-masters

##############################################################################
# Memory Limits
##############################################################################

# Total available memory
total_memory_available_override_value = 2GB

# Memory high watermark
vm_memory_high_watermark.relative = 0.6

# Memory low watermark
vm_memory_low_watermark.relative = 0.4

##############################################################################
# Disk Limits
##############################################################################

# Free disk space limit
disk_free_limit.absolute = 50GB

##############################################################################
# Channel Settings
##############################################################################

# Channel max (maximum number of channels per connection)
channel_max = 2048

# Connection max (maximum number of connections)
connection_max = 20000

##############################################################################
# Queue and Message Settings
##############################################################################

# Message TTL (time-to-live)
# Queues will be automatically deleted when idle
collect_statistics_interval = 5000

# Max message count in memory before paging to disk
queue_index_embed_msgs_below = 4096

##############################################################################
# Heartbeat Configuration
##############################################################################

# Heartbeat interval (in seconds)
heartbeat = 60

# Frame max (maximum size of frames)
frame_max = 131072

##############################################################################
# Clustering Configuration
##############################################################################

# Cluster partition handling strategy
cluster_partition_handling = autoheal

# Node shutdown behavior
mirrored_queue_slave_wait_time = 5000

##############################################################################
# Clustering - Keepalive
##############################################################################

# Keepalive settings for cluster links
net_ticktime = 60

##############################################################################
# Authentication and Authorization
##############################################################################

# Authentication mechanism
auth_mechanisms.1 = EXTERNAL
auth_mechanisms.2 = PLAIN
auth_mechanisms.3 = AMQPLAIN

# Authorization mechanism
authz_backend.1 = internal

# Password hashing algorithm
password_hash_module = rabbit_password_hashing_sha256

##############################################################################
# Plugins Configuration
##############################################################################

# Enabled plugins
plugins.dir = /opt/rabbitmq/plugins

# Plugins to enable on startup
management.load_definitions = /etc/rabbitmq/definitions.json

##############################################################################
# Logging Configuration
##############################################################################

# Log file location
log.file.level = info

# Console (stdout) log level
log.console.level = info

# Console format
log.console = true

# Structured logging
log.console.metadata_format = json

##############################################################################
# Statistics Collection
##############################################################################

# Collect statistics for monitoring and management
collect_statistics_interval = 5000

# Statistics interval for memory monitoring
statistics_event_max_backlog = 250

##############################################################################
# Message Replication
##############################################################################

# Number of replicas for mirrored queues
mirrored_queue_slave_count = 1

# Wait for synchronized slaves before committing (queue sync)
queue_replica_synchronisation_count = quorum

##############################################################################
# Credit Flow
##############################################################################

# Credit flow for message rates
credit_flow_default_credit = 400

##############################################################################
# TCP Connection Tuning
##############################################################################

# TCP backlog
listeners.tcp.backlog = 4096

# TCP keepalive
listeners.tcp.keepalive = true

# TCP send timeout
listeners.tcp.send_timeout = 120000

# TCP receive buffer size
listeners.tcp.recv_buf = 131072

# TCP send buffer size
listeners.tcp.send_buf = 131072

##############################################################################
# Management UI Settings
##############################################################################

# Management plugin timeout (in milliseconds)
management.load_definitions_timeout = 60000

# Limits for stats collection
management.max_request_size = 10485760

##############################################################################
# Background Tasks
##############################################################################

# Channel operation timeout
channel_operation_timeout = 15000

# Broker operation timeout
broker_operation_timeout = 60000

##############################################################################
# Resource Limits
##############################################################################

# Max number of open file descriptors
ulimit.nofile = 262144

# Process limits for Erlang VM
# Note: Controlled via docker environment and system limits

##############################################################################
# Quorum Queues Configuration
##############################################################################

# Initial cluster size for quorum queues
quorum.initial_group_size = 3

# Quorum queue tick interval
quorum.tick_interval = 250

##############################################################################
# Runtime Parameter Configuration
##############################################################################

# Allow runtime parameter changes
parameters.runtime_parameters = all

##############################################################################
# Shutdown and Graceful Termination
##############################################################################

# Graceful shutdown timeout (in milliseconds)
shutdown_timeout = 30000

# Channel closing timeout
channel_termination_timeout = 30000
