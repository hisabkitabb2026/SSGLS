[SERVICE]
    # Fluent Bit service configuration
    Daemon                  Off
    Flush                   5
    Log_Level               info
    Parsers_File            parsers.conf
    Plugins_File            plugins.conf
    HTTP_Server             On
    HTTP_Listen             0.0.0.0
    HTTP_Port               9000
    storage.path            /var/log/fluent-bit/state
    storage.sync            normal

###############################################################################
# INPUT PLUGINS - Receive logs from Kong and microservices
###############################################################################

# Kong HTTP Logging Input
[INPUT]
    Name                http
    Listen              0.0.0.0
    Port                9000
    uri                 /logs
    Format              json
    Tag                 kong.*

# Fluent Forward Protocol Input
[INPUT]
    Name                forward
    Listen              0.0.0.0
    Port                24224
    Tag                 forward.*

# Docker Container Logs
[INPUT]
    Name                docker
    Tag                 docker.*
    Path                /var/run/docker.sock

###############################################################################
# FILTER PLUGINS - Process and enrich logs
###############################################################################

# Kong Log Processing
[FILTER]
    Name                parser
    Match               kong.*
    Key_Name            body
    Parser              kong_json
    Reserve_Data        On

# Add trace ID from headers
[FILTER]
    Name                modify
    Match               kong.*
    Add                 service_name Kong
    Add                 environment production
    Condition           Key_Value_Equals request_headers["x-trace-id"] ^[a-f0-9]{32}$

# Docker logs enrichment
[FILTER]
    Name                modify
    Match               docker.*
    Add                 log_source docker

# Add timestamp if missing
[FILTER]
    Name                nest
    Match               *
    Operation           lift
    Nested_under        metadata

###############################################################################
# OUTPUT PLUGINS - Send processed logs to Elasticsearch
###############################################################################

# Elasticsearch Output
[OUTPUT]
    Name                es
    Match               kong.*
    Host                elasticsearch
    Port                9200
    HTTP_User           elastic
    HTTP_Passwd         changeme
    Logstash_Format     On
    Logstash_Prefix     kong-logs
    Logstash_DateFormat %Y.%m.%d
    Type                _doc
    Time_Key            @timestamp
    Time_Key_Format     %Y-%m-%dT%H:%M:%S.%LZ
    Retry_Limit         5

# Elasticsearch for microservice logs
[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch
    Port                9200
    HTTP_User           elastic
    HTTP_Passwd         changeme
    Logstash_Format     On
    Logstash_Prefix     microservices-logs
    Logstash_DateFormat %Y.%m.%d
    Type                _doc
    Retry_Limit         5

# Standard output for debugging
[OUTPUT]
    Name                stdout
    Match               *
    Format              json_lines

# Syslog output for critical logs
[OUTPUT]
    Name                syslog
    Match               kong.error
    Host                localhost
    Port                514
    Mode                udp
    SYSLOG_FORMAT       rfc5424
    Tag                 kong-error
