[pytest]
# Pytest configuration for End-to-End Testing

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --capture=no
    -ra

# Test paths
testpaths = .

# Markers
markers =
    e2e: End-to-end integration tests
    journey: User journey tests
    gateway: API Gateway routing tests
    auth: Authentication and authorization tests
    events: Event propagation tests
    consistency: Data consistency tests
    slow: Slow running tests
    critical: Critical path tests
    flaky: Known flaky tests

# Logging
log_cli = true
log_cli_level = INFO
log_file = pytest_e2e.log
log_file_level = DEBUG

# Timeout (5 minutes per test)
timeout = 300

# Asyncio
asyncio_mode = auto

# Show slowest tests
durations = 10

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto
