  # Rate Limiting - API Services (100 req/min per consumer)
  - name: rate-limiting
    service: invoice-service
    config:
      minute: 100
      limit_by: consumer
      policy: redis
      fault_tolerant: true
      redis_host: redis
      redis_port: 6379
      redis_database: 0

  - name: rate-limiting
    service: expense-service
    config:
      minute: 100
      limit_by: consumer
      policy: redis
      fault_tolerant: true
      redis_host: redis
      redis_port: 6379
      redis_database: 0

  - name: rate-limiting
    service: product-service
    config:
      minute: 100
      limit_by: consumer
      policy: redis
      fault_tolerant: true
      redis_host: redis
      redis_port: 6379
      redis_database: 0

  - name: rate-limiting
    service: customer-service
    config:
      minute: 100
      limit_by: consumer
      policy: redis
      fault_tolerant: true
      redis_host: redis
      redis_port: 6379
      redis_database: 0

  - name: rate-limiting
    service: settings-service
    config:
      minute: 100
      limit_by: consumer
      policy: redis
      fault_tolerant: true
      redis_host: redis
      redis_port: 6379
      redis_database: 0

  - name: rate-limiting
    service: transport-service
    config:
      minute: 100
      limit_by: consumer
      policy: redis
      fault_tolerant: true
      redis_host: redis
      redis_port: 6379
      redis_database: 0

  # Rate Limiting - Health Check (high limit, IP-based)
  - name: rate-limiting
    service: health-service
    config:
      second: 100
      limit_by: ip
      policy: local
      fault_tolerant: true

  # HTTP Logging - Request/Response logging
  - name: http-log
    config:
      http_endpoint: http://logging-aggregator:9000/logs
      method: POST
      timeout: 1000
      keepalive: 60000
      content_type: application/json
      flush_timeout: 2
      retry_count: 5

  # Proxy Cache for GET requests (5 min TTL)
  - name: proxy-cache
    service: invoice-service
    config:
      content_type:
        - application/json
      cache_ttl: 300
      strategy: memory
      cache_control: true
      vary_headers:
        - X-Company-ID
      vary_query_params:
        - page
        - limit
        - sort
        - filter

  - name: proxy-cache
    service: product-service
    config:
      content_type:
        - application/json
      cache_ttl: 300
      strategy: memory
      cache_control: true
      vary_headers:
        - X-Company-ID
      vary_query_params:
        - page
        - limit
        - sort

  # Request Size Limiting (100MB for file uploads)
  - name: request-size-limiting
    service: invoice-service
    config:
      allowed_payload_size: 100
      size_units: megabytes

  - name: request-size-limiting
    service: expense-service
    config:
      allowed_payload_size: 100
      size_units: megabytes

  - name: request-size-limiting
    service: product-service
    config:
      allowed_payload_size: 100
      size_units: megabytes

