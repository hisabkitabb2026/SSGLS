# Kong Services Configuration
# DDD-based service routing for InvoiceShelf

---
# Invoice Domain Service
- name: invoice-service
  protocol: http
  host: app
  port: 9000
  path: /api/v1/invoices
  connect_timeout: 6000
  write_timeout: 60000
  read_timeout: 60000
  retries: 3
  tags:
    - domain:invoice
    - ddd
  ca_certificates: []
  enabled: true

