# Kong Routes Configuration
# URL mappings and routing rules for InvoiceShelf API

---
# Invoice Routes
- name: invoice-list
  service: invoice-service
  paths:
    - /api/v1/invoices
  methods:
    - GET
  strip_path: false
  tags:
    - domain:invoice
    - list
  enabled: true

---
- name: invoice-create
  service: invoice-service
  paths:
    - /api/v1/invoices
  methods:
    - POST
  strip_path: false
  tags:
    - domain:invoice
    - create
  enabled: true

---
- name: invoice-detail
  service: invoice-service
  paths:
    - /api/v1/invoices/(?<id>[0-9]+)
  regex_priority: 10
  methods:
    - GET
  strip_path: false
  tags:
    - domain:invoice
    - detail
  enabled: true

---
- name: invoice-update
  service: invoice-service
  paths:
    - /api/v1/invoices/(?<id>[0-9]+)
  regex_priority: 10
  methods:
    - PUT
    - PATCH
  strip_path: false
  tags:
    - domain:invoice
    - update
  enabled: true

---
- name: invoice-delete
  service: invoice-service
  paths:
    - /api/v1/invoices/(?<id>[0-9]+)
  regex_priority: 10
  methods:
    - DELETE
  strip_path: false
  tags:
    - domain:invoice
    - delete
  enabled: true

---
- name: invoice-pdf
  service: invoice-service
  paths:
    - /api/v1/invoices/(?<id>[0-9]+)/pdf
  regex_priority: 15
  methods:
    - GET
    - POST
  strip_path: false
  tags:
    - domain:invoice
    - pdf
  enabled: true

