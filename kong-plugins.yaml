# Kong Plugins Configuration
# JWT, Rate Limiting, CORS, and other middleware for InvoiceShelf

---
# CORS Plugin - Global
- name: cors
  config:
    origins:
      - http://invoiceshelf.test
      - http://localhost:5173
      - http://localhost:3000
      - http://localhost:8080
      - https://invoiceshelf.test
      - https://localhost:5173
      - https://app.invoiceshelf.local
    methods:
      - GET
      - HEAD
      - PUT
      - PATCH
      - POST
      - DELETE
      - OPTIONS
    headers:
      - Accept
      - Accept-Version
      - Content-Length
      - Content-MD5
      - Content-Type
      - Date
      - X-Auth-Token
      - X-API-Key
      - X-Company-ID
      - Authorization
      - X-Requested-With
    exposed_headers:
      - X-Auth-Token
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - X-RateLimit-Reset
      - X-Request-ID
      - Content-Type
    credentials: true
    max_age: 3600
    preflight_continue: false
  enabled: true

---
# Request/Response Logging Plugin
- name: http-log
  route: null
  service: null
  config:
    http_endpoint: http://logging-service:9000/logs
    method: POST
    timeout: 1000
    keepalive: 60000
    content_type: application/json
    flush_timeout: 2
    retry_count: 5
    queue_size: 1000
    queue_timeout: 5
  enabled: true

---
# Rate Limiting Plugin - API Routes (500 req/hour)
- name: rate-limiting
  route: null
  service: null
  config:
    second: null
    minute: 500
    hour: null
    day: null
    month: null
    year: null
    limit_by: consumer
    policy: local
    fault_tolerant: true
    hide_client_headers: false
    redis_host: redis
    redis_port: 6379
    redis_database: 0
    redis_password: null
  tags:
    - rate-limit
    - api
  enabled: true

---
# Rate Limiting for Public Endpoints - Higher Limit
- name: rate-limiting
  route: null
  service: health-service
  config:
    second: 100
    minute: null
    hour: null
    day: null
    month: null
    year: null
    limit_by: ip
    policy: local
    fault_tolerant: true
    hide_client_headers: false
  tags:
    - rate-limit
    - public
  enabled: true

---
# JWT Authentication Plugin - Protected Routes
- name: jwt
  route: null
  service: invoice-service
  config:
    key_claim_name: iss
    secret_is_base64: false
    uri_param_names:
      - jwt
    cookie_names:
      - jwt
      - auth_token
    claims_to_verify:
      - exp
      - nbf
    algorithms:
      - HS256
      - HS512
      - RS256
    rsa_public_key: null
    scope: null
    audience: invoiceshelf-api
  tags:
    - auth
    - jwt
  enabled: true

---
# JWT for Estimate Service
- name: jwt
  route: null
  service: estimate-service
  config:
    key_claim_name: iss
    secret_is_base64: false
    uri_param_names:
